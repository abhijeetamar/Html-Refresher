<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box sizing</title>
    <link rel="stylesheet" href="Boxsizing.css">
</head>
<body>
    <h1>Without Box Sizing</h1>
    <div class="card normal">
        <p>This card has padding border but no box-sizing</p>
    </div>    
    
    <h1>With box-sizing border-box</h1>
    <div class="card box">
        <p>This card has padding border and box-sizing </p>
    </div>
</body>
</html>
